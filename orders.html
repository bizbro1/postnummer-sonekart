<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ordregenerator</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

  <div id="loading-overlay">
    <div class="loading-box">
      <div class="spinner"></div>
      <p id="loading-text">Laster postnummerområder...</p>
    </div>
  </div>

  <div id="app">
    <div id="map"></div>

    <div id="panel">
      <div id="nav-tabs">
        <a href="/" class="nav-tab">Sonekart</a>
        <a href="/orders.html" class="nav-tab active">Ordregenerator</a>
      </div>

      <div class="tab-content active" id="tab-orders">

        <div class="panel-section">
          <label>Velg soner:</label>
          <div id="order-gen-groups" class="order-checkbox-list"></div>
        </div>

        <div class="panel-section">
          <label>Antall ordre:</label>
          <input type="number" id="order-gen-count" value="5" min="1" max="200" />
        </div>

        <div class="panel-section">
          <button id="btn-gen-orders" class="btn-generate">Generer ordre</button>
          <div id="order-gen-status" class="order-gen-status"></div>
        </div>

        <div class="panel-section order-results-section">
          <div id="order-results" class="order-results"></div>
        </div>

        <div class="panel-section panel-actions">
          <button id="btn-copy-orders">Kopier</button>
          <button id="btn-export-orders-csv">Last ned CSV</button>
          <button id="btn-export-orders-json">Last ned JSON</button>
          <button id="btn-show-orders-map">Vis på kart</button>
        </div>

      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="/src/orders-main.js"></script>
</body>
</html>
